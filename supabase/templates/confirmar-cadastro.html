<!-- Assunto: Confirme seu cadastro no CashControl -->
<!-- Supabase: Authentication → Emails → Templates → Confirm signup -->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f3f8;padding:32px 16px;font-family:Arial,Helvetica,sans-serif;">
  <tr>
    <td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#ffffff;border-radius:16px;padding:32px;">
        <tr>
          <td style="font-size:20px;font-weight:bold;color:#0b0a10;padding-bottom:4px;">Cash<span style="color:#7c3aed;">Control</span></td>
        </tr>
        <tr>
          <td style="font-size:22px;font-weight:bold;color:#0b0a10;padding:20px 0 8px;">Confirme seu e-mail</td>
        </tr>
        <tr>
          <td style="font-size:15px;line-height:1.6;color:#4a4757;padding-bottom:24px;">
            Falta só um passo para começar a ver seu lucro real, jornada por jornada. Toque no botão abaixo para ativar sua conta.
          </td>
        </tr>
        <tr>
          <td align="center" style="padding-bottom:24px;">
            <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#7c3aed;color:#ffffff;text-decoration:none;font-size:16px;font-weight:bold;padding:14px 28px;border-radius:12px;">Confirmar e-mail</a>
          </td>
        </tr>
        <tr>
          <td style="font-size:13px;line-height:1.6;color:#6f6c80;">
            Se você não criou uma conta no CashControl, ignore este e-mail.
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
