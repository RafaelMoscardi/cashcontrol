<!-- Assunto: Redefina sua senha do CashControl -->
<!-- Supabase: Authentication → Emails → Templates → Reset password -->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f3f8;padding:32px 16px;font-family:Arial,Helvetica,sans-serif;">
  <tr>
    <td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#ffffff;border-radius:16px;padding:32px;">
        <tr>
          <td style="font-size:20px;font-weight:bold;color:#0b0a10;padding-bottom:4px;">Cash<span style="color:#7c3aed;">Control</span></td>
        </tr>
        <tr>
          <td style="font-size:22px;font-weight:bold;color:#0b0a10;padding:20px 0 8px;">Redefinir sua senha</td>
        </tr>
        <tr>
          <td style="font-size:15px;line-height:1.6;color:#4a4757;padding-bottom:24px;">
            Recebemos um pedido para criar uma nova senha para <strong>{{ .Email }}</strong>. O link vale por 1 hora e funciona uma vez só.
          </td>
        </tr>
        <tr>
          <td align="center" style="padding-bottom:24px;">
            <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#7c3aed;color:#ffffff;text-decoration:none;font-size:16px;font-weight:bold;padding:14px 28px;border-radius:12px;">Criar nova senha</a>
          </td>
        </tr>
        <tr>
          <td style="font-size:13px;line-height:1.6;color:#6f6c80;">
            Se não foi você, ignore este e-mail: sua senha continua a mesma.
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
